[project]
name = "evalgate-br"
version = "0.1.0"
description = "Free-model leaderboard for Portuguese-language data tasks, and a CI gate that blocks a pull request when a prompt change makes things measurably worse."
requires-python = ">=3.11"
dependencies = [
    "databricks-sdk>=0.170.0",
    "google-genai>=3.6.1",
    "httpx>=0.27",
    "inspect-ai>=0.3.292",
    "openai>=3.57.0",
    "pydantic>=2.6",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
]

[project.scripts]
evalgate = "evalgate.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalgate"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
